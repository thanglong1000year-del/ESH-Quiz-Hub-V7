name: CI

# Tự động chạy mỗi khi có push hoặc Pull Request vào main — bắt lỗi
# cú pháp/dependency ngay trên hạ tầng GitHub (sandbox Claude bị chặn
# kết nối npm registry nên không tự kiểm tra được, workflow này thay thế).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Chưa dùng cache: "npm" vì repo chưa có package-lock.json (sandbox
          # Claude không cài được npm packages để tạo lockfile). Sau lần
          # `npm install` đầu tiên trên máy thật, commit package-lock.json
          # rồi bật lại cache ở đây để build nhanh hơn.

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: |
          set +e
          npm run lint > lint-output.log 2>&1
          code=$?
          cat lint-output.log
          if [ $code -ne 0 ]; then
            SUMMARY=$(tail -c 3000 lint-output.log | tr '\n' ' ' | tr '%' ' ' | tr '\r' ' ')
            echo "::error::Lint thất bại (exit $code). Output: ${SUMMARY}"
            exit $code
          fi

      - name: Build
        run: npm run build

  functions:
    name: Cloud Functions — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: functions
        run: npm install

      - name: Build
        working-directory: functions
        run: npm run build

  firestore-rules:
    name: Firestore Rules — kiểm tra cú pháp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cài Firebase CLI
        run: npm install -g firebase-tools

      - name: Kiểm tra cú pháp rules (không cần project thật)
        env:
          CI: "true"
        run: |
          set +e
          firebase --config ci-firebase.json emulators:exec --only firestore --project demo-ci "echo 'rules OK'" \
            > emulator-output.log 2>&1
          code=$?
          cat emulator-output.log
          if [ -f firebase-debug.log ]; then
            echo "----- firebase-debug.log (tail) -----"
            tail -n 100 firebase-debug.log
          fi
          if [ $code -ne 0 ]; then
            # Tải log bằng gh run view bị chặn trong sandbox Claude (log zip
            # chuyển hướng qua Azure Blob Storage ngoài allowlist), nên in lỗi
            # thật ra dưới dạng annotation GitHub (lấy được qua Checks API,
            # không cần tải log) để chẩn đoán được từ bên ngoài runner.
            SUMMARY=$(tail -c 3000 emulator-output.log | tr '\n' ' ' | tr '%' ' ' | tr '\r' ' ')
            echo "::error::Firestore emulator exec thất bại (exit $code). Output: ${SUMMARY}"
            exit $code
          fi
